<p>BrandVideo 视频品牌助手 重视您的隐私。本政策说明您在使用应用时，我们如何处理相关信息。</p>

<h2>4. 支付</h2>
<p>所有支付均由 Apple 安全处理，我们不会保存您的支付信息。</p>
<h2>5. 信息共享</h2>

    <p>
      月之谣是一款离线睡眠氛围应用。我们非常重视您的隐私。本隐私政策说明月之谣如何处理用户信息。
    </p>

    <h2>1. 我们收集哪些信息</h2>
    <p>
      月之谣不会收集、存储、上传或分享您的个人信息。
    </p>
    <ul>
      <li>不需要注册账号</li>
      <li>不收集姓名、邮箱、电话号码等身份信息</li>
      <li>不收集位置信息</li>
      <li>不收集通讯录、照片、麦克风或摄像头数据</li>
      <li>不追踪您的使用行为</li>
    </ul>

    <h2>2. 网络连接</h2>
    <p>
      月之谣的睡眠氛围音频内置于应用中，可离线使用。应用本身不依赖服务器，不需要联网即可播放音频。
    </p>

    <h2>3. 广告与追踪</h2>
    <p>
      月之谣不展示第三方广告，也不使用第三方广告追踪 SDK。
    </p>

    <h2>4. 应用内购买</h2>
    <p>
      月之谣可能提供一次性应用内购买，用于解锁高级内容。购买流程由 Apple App Store 处理，我们不会获取您的银行卡、支付账号或完整交易支付信息。

    <h2>5. 本地数据</h2>

      应用可能会在您的设备本地保存一些设置，例如音量、定时器偏好或购买解锁状态。这些数据仅保存在您的设备上，不会上传至我们的服务器。

    <h2>6. 儿童隐私</h2>

      月之谣不会有意收集儿童的个人信息。如果您认为我们无意中收集了相关信息，请通过下方邮箱联系我们。

<main class="star-page">
  <header class="star-hero">

    <h1>星宠任务岛 隐私政策</h1>
    <p class="star-date">生效及最后更新日期：2026年7月20日</p>
  </header>

  <article class="star-policy">
    <p>星宠任务岛（以下简称“本应用”）是一款由家长和孩子共同使用的家庭任务与成长激励应用。我们重视家庭成员，尤其是儿童的隐私。本政策说明本应用会处理哪些信息、处理目的、存储方式，以及您可以如何管理或删除相关信息。</p>

    <p class="star-note"><strong>简要说明：</strong>本应用无需注册开发者账号，不展示第三方广告，不进行跨应用追踪，也不接入第三方广告或行为分析 SDK。应用数据主要保存在您的设备，并在 iCloud 可用时通过 Apple CloudKit 同步。</p>

    <h2>1. 我们处理的信息</h2>
    <p>为提供任务管理、奖励和成长记录等核心功能，本应用会处理由家长或设备使用者主动输入或产生的以下信息：</p>
    <ul>
      <li><strong>家庭与儿童资料：</strong>家庭名称、孩子昵称、头像选择以及相关标识符。</li>
      <li><strong>任务与成长数据：</strong>任务内容、完成记录、星星余额、奖励记录、礼物兑换、宠物、装备、战斗及家园进度。</li>
      <li><strong>礼品图片：</strong>仅在家长主动拍摄或选择图片作为礼品封面时处理。</li>
      <li><strong>应用设置：</strong>同步状态、界面偏好及维持应用正常运行所需的本地配置。</li>
      <li><strong>家长 PIN：</strong>用于保护家长功能。应用仅在设备本地保存经过加盐哈希处理的验证值，不保存可读取的明文 PIN，也不会将 PIN 同步至 iCloud。</li>
    </ul>
    <p>我们不会要求提供真实姓名、邮箱、电话号码、精确位置、通讯录或支付信息。</p>

    <h2>2. 相机与相册权限</h2>
    <p>当家长选择为礼品添加图片时，本应用才会请求使用相机或让您从系统照片选择器中选取图片。所选图片仅用于您创建的礼品内容。您可以在 iOS“设置”中随时更改相机或照片权限；拒绝权限不会影响不依赖图片的其他功能。</p>

    <h2>3. 本地存储与 iCloud 同步</h2>
    <p>应用数据首先保存在设备本地。默认情况下，如果设备已登录并启用 iCloud，本应用会使用 Apple CloudKit 将家庭资料、任务记录、成长数据及礼品图片上传至您的 iCloud 私有数据库，以便在登录同一 Apple 账户的设备之间同步。若 iCloud 不可用，应用会回退为仅在当前设备保存。</p>
    <p>iCloud 服务由 Apple 提供，其对数据的处理受 Apple 的隐私政策和服务条款约束。除 Apple 为提供 iCloud 服务所进行的处理外，我们不会把这些数据出售、出租或提供给广告商、数据经纪商或其他第三方。</p>

    <h2>4. 使用目的</h2>
    <p>上述信息仅用于：</p>
    <ul>
      <li>创建和管理家庭任务、奖励、礼物及成长进度；</li>
      <li>在设备上展示儿童专属内容，并通过家长 PIN 保护家长操作；</li>
      <li>在您启用 iCloud 时同步和恢复应用数据；</li>
      <li>响应您主动发送的技术支持请求。</li>
    </ul>

    <h2>5. 广告、分析与追踪</h2>
    <p>本应用不展示第三方广告，不使用第三方广告、营销、用户画像或跨应用追踪工具，也不出售个人信息。我们目前未接入第三方崩溃分析或行为分析 SDK。</p>

    <h2>6. 儿童隐私</h2>
    <p>本应用可能供儿童在家长监督下使用。儿童资料和活动记录应由家长或监护人创建并管理。我们不会要求儿童注册账号，不会基于儿童数据投放广告，也不会主动向儿童收集联系方式。家长或监护人可以按第 7 条所述方式删除相关数据。</p>

    <h2>7. 数据保留、删除与权限撤回</h2>
    <p>数据会保留在设备及您的 iCloud 中，直到您在应用内删除相关内容、删除应用及其本地数据，或从 iCloud 中删除本应用数据。由于应用没有开发者账号系统，我们无法远程识别或直接删除您 iCloud 私有数据库中的内容。</p>
    <ul>
      <li>您可在应用内删除或修改任务、奖励、礼物等内容。</li>
      <li>您可在 iOS“设置”中撤回相机或照片权限。</li>
      <li>您可在 Apple 账户的 iCloud 管理界面中管理或删除本应用的 iCloud 数据。</li>
      <li>如需删除当前设备上的全部本地数据，可删除本应用；再次安装前请同时确认是否保留了 iCloud 数据。</li>
    </ul>

    <h2>8. 数据安全</h2>
    <p>我们采用设备系统提供的存储保护、家长 PIN 哈希验证及 Apple CloudKit 的安全能力来降低未经授权访问的风险。但任何存储或传输方式都无法保证绝对安全，请妥善保护您的设备、Apple 账户和家长 PIN。</p>

    <h2>9. 政策变更</h2>
    <p>当应用功能、数据处理方式或适用要求发生变化时，我们可能更新本政策。更新版本会发布在本页面并标注新的生效日期。若发生重大变化，我们会在适当情况下通过应用内提示等方式说明。</p>

    <h2>10. 联系我们</h2>
    <p>如果您对本政策、儿童隐私或数据管理有疑问，请联系星宠任务岛开发者：</p>
    <p><a href="mailto:453554515@qq.com">453554515@qq.com</a></p>

    </nav>
  </article>
